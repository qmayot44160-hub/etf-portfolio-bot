<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — ETF Bot</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111726;
    --border: #1f2a3d;
    --accent: #4f9eff;
    --text: #e6ecf4;
    --muted: #8090a8;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .logo span { color: var(--accent); }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: var(--accent); }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  .error {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
    color: var(--error);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    text-align: center;
  }
  .foot {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="logo">ETF <span>Bot</span></div>
    <div class="sub">Accès sécurisé au dashboard</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Se connecter</button>
    <div class="foot">Sessions chiffrées · Credentials Fernet AES</div>
  </form>
</body>
</html>
