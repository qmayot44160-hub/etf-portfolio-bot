<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Page introuvable · PortfolioQuant</title>
<style>
  :root {
    --sf-bg: #000; --sf-text: #f5f5f7;
    --sf-text-secondary: #a1a1a6; --sf-text-muted: #6e6e73;
    --sf-blue: #0a84ff; --sf-green: #30d158; --sf-border: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--sf-bg); color: var(--sf-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
    position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -200px; left: -200px;
    width: 600px; height: 600px; border-radius: 50%;
    filter: blur(120px); opacity: 0.4; pointer-events: none;
    background: radial-gradient(circle, rgba(10,132,255,0.3), transparent 70%);
  }
  body::after {
    content: ''; position: fixed; bottom: -200px; right: -200px;
    width: 500px; height: 500px; border-radius: 50%;
    filter: blur(120px); opacity: 0.3; pointer-events: none;
    background: radial-gradient(circle, rgba(48,209,88,0.15), transparent 70%);
  }
  .topbar {
    position: relative; z-index: 2;
    border-bottom: 1px solid var(--sf-border);
    padding: 0 48px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em;
    color: var(--sf-text); text-decoration: none;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--sf-blue); box-shadow: 0 0 12px rgba(10,132,255,0.6);
  }
  .brand-logo {
    background: linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  main {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px;
  }
  .code {
    font-size: 8rem; font-weight: 700; letter-spacing: -0.05em; line-height: 1;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.04));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 24px;
    font-variant-numeric: tabular-nums;
  }
  h1 {
    font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  p {
    color: var(--sf-text-secondary); font-size: 1rem; line-height: 1.6;
    max-width: 44ch; margin-bottom: 36px;
  }
  .actions { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 22px; border-radius: 12px;
    background: linear-gradient(180deg, #3ba4ff 0%, #0d84ff 100%);
    color: #fff; font-size: 0.9rem; font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(10,132,255,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(10,132,255,0.4); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 22px; border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--sf-text-secondary); font-size: 0.9rem; font-weight: 500;
    text-decoration: none; transition: background 0.15s, color 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.07); color: var(--sf-text); }
  footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--sf-border);
    padding: 24px 48px;
    display: flex; justify-content: center;
    color: var(--sf-text-muted); font-size: 0.78rem;
  }
  @media (max-width: 480px) { .topbar { padding: 0 24px; } .code { font-size: 5rem; } }
</style>
</head>
<body>
  <header class="topbar">
    <a href="/welcome" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-logo">PortfolioQuant</span>
    </a>
  </header>

  <main>
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>Cette URL n'existe pas ou a été déplacée. Retourne à la présentation ou connecte-toi directement.</p>
    <div class="actions">
      <a href="/welcome" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Retour à l'accueil
      </a>
      <a href="/login" class="btn-secondary">
        Se connecter
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </main>

  <footer>© 2026 PortfolioQuant · Données locales uniquement</footer>
</body>
</html>
