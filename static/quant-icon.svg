<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quant">
  <defs>
    <linearGradient id="qi-gloss" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="qi-inner-edge" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Carte sombre alignée DA -->
  <rect width="512" height="512" rx="116" fill="#0a0a0e"/>
  <rect width="512" height="512" rx="116" fill="url(#qi-gloss)"/>
  <rect width="512" height="512" rx="116" fill="url(#qi-inner-edge)"
        style="mix-blend-mode: screen"/>

  <!-- Q stylisé : anneau + queue tapered (même path que le glyph header,
       mais centré sur 256/256 dans une carte) -->
  <g fill="#ffffff" transform="translate(0,0)">
    <!-- Anneau plus compact (outer 130, inner 60) pour padding généreux -->
    <path fill-rule="evenodd" d="
      M 256 126 a 130 130 0 1 0 0.001 0 Z
      M 256 196 a 60 60 0 1 1 -0.001 0 Z
    "/>
    <!-- Queue tapered, recentrée sur la nouvelle taille d'anneau -->
    <path d="
      M 314 348
      L 348 314
      L 410 380
      Q 420 392 412 402
      Q 402 412 396 400
      Z
    "/>
  </g>

  <!-- Contour bleu nuit + liseré intérieur "verre" -->
  <rect x="2" y="2" width="508" height="508" rx="114"
        fill="none" stroke="#1a3a7a" stroke-width="3"/>
  <rect x="5" y="5" width="502" height="502" rx="111"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
