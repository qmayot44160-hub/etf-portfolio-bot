<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quant">
  <!-- Fond aligné sur la DA : noir profond comme le theme-color de l'app
       (#0a0a0e). Liseré subtil 1px pour décoller du fond noir système. -->
  <rect width="512" height="512" rx="116" fill="#0a0a0e"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="115.5"
        fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Q blanc — anneau compact, padding généreux. -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 256 138
    a 118 118 0 1 0 0.001 0
    Z
    M 256 202
    a 54 54 0 1 1 -0.001 0
    Z
  "/>

  <!-- Queue diagonale 45°, blanche. -->
  <rect x="304" y="332" width="78" height="28" rx="14"
        fill="#ffffff"
        transform="rotate(45 343 346)"/>
</svg>
