<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quant">
  <!-- Carré arrondi monochrome — style icône système iOS / One UI. -->
  <rect width="512" height="512" rx="116" fill="#0a84ff"/>

  <!-- Q : anneau plus compact (rayons réduits → padding généreux autour,
       comme les icônes système Apple). Outer 118, inner 54.
       Even-odd pour évider l'anneau. -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 256 138
    a 118 118 0 1 0 0.001 0
    Z
    M 256 202
    a 54 54 0 1 1 -0.001 0
    Z
  "/>

  <!-- Queue : trait diagonal court à 45°, croisant l'anneau en bas-droite.
       Largeur alignée sur l'épaisseur de l'anneau (64px) pour cohérence. -->
  <rect x="304" y="332" width="78" height="28" rx="14"
        fill="#ffffff"
        transform="rotate(45 343 346)"/>
</svg>
