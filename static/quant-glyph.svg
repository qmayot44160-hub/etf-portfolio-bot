<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quant">
  <!-- Q typographique : on utilise le Q de la stack système
       (SF Pro Display sur Apple, Segoe UI sur Windows, Roboto sur Android).
       Bold (700), letterspacing serré, currentColor pour héritage thème. -->
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Roboto', sans-serif"
        font-weight="700"
        font-size="440"
        letter-spacing="-20"
        fill="currentColor">Q</text>
</svg>
